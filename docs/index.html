<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Интерактивная документация API Murroom" />
    <title>Murroom API</title>
    <link rel="preconnect" href="https://unpkg.com" />
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" />
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      body { margin: 0; background: #f7f7fb; color: #1e1b2e; }
      header { padding: 28px clamp(20px, 5vw, 72px); background: #2f2454; color: white; }
      h1 { margin: 0; font-size: clamp(28px, 4vw, 42px); }
      header p { max-width: 720px; margin: 10px 0 0; color: #ded6f8; line-height: 1.55; }
      .links { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 18px; }
      .links a { color: white; border: 1px solid #a997e8; border-radius: 8px; padding: 8px 12px; text-decoration: none; }
      .links a:hover { background: #49377b; }
      #status { margin: 16px auto 0; max-width: 1440px; padding: 0 20px; color: #625c72; }
      #swagger-ui { max-width: 1440px; margin: 0 auto; padding: 0 12px 48px; }
      .swagger-ui .topbar { display: none; }
    </style>
  </head>
  <body>
    <header>
      <h1>Murroom API</h1>
      <p>Интерактивная документация контракта. Страница всегда загружает опубликованную версию корневого <code>openapi.yaml</code>.</p>
      <nav class="links" aria-label="Полезные ссылки">
        <a href="./openapi.yaml">Открыть OpenAPI YAML</a>
        <a href="https://github.com/swagalabs/murroom-service/blob/main/docs/ARCHITECTURE.md">Архитектура проекта</a>
      </nav>
    </header>
    <p id="status" role="status">Загружаем контракт…</p>
    <main id="swagger-ui" aria-label="Документация API"></main>

    <script src="https://unpkg.com/js-yaml@4/dist/js-yaml.min.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js" crossorigin="anonymous"></script>
    <script>
      const status = document.getElementById("status");
      const specCandidates = ["./openapi.yaml", "../openapi.yaml"];

      async function loadSpecification() {
        for (const url of specCandidates) {
          const response = await fetch(url, { cache: "no-store" });
          if (response.ok) return { url, yaml: await response.text() };
        }
        throw new Error("openapi.yaml не найден.");
      }

      loadSpecification()
        .then(({ url, yaml }) => {
          status.textContent = `Контракт загружен из ${url}`;
          window.ui = SwaggerUIBundle({
            spec: window.jsyaml.load(yaml),
            dom_id: "#swagger-ui",
            deepLinking: true,
            displayRequestDuration: true,
            tryItOutEnabled: true,
            persistAuthorization: true,
          });
        })
        .catch((error) => {
          status.textContent = `Не удалось загрузить контракт: ${error.message}`;
        });
    </script>
  </body>
</html>
